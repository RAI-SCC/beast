name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/jigsaw/
          pip install -e ".[dev]"

      - name: mypy
        run: mypy --config-file pyproject.toml --ignore-missing-imports

  test:
    name: Tests (CPU, single rank)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The suite builds real zarr stores as fixtures and writes ~8 GB to TMPDIR
      # in a single run. The runner's default /tmp does not have room, so point
      # TMPDIR at the workspace volume and confirm there is space before starting.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/jigsaw/
          pip install -e ".[dev]"

      - name: Run tests
        env:
          TMPDIR: ${{ github.workspace }}/.pytest-tmp
        run: |
          mkdir -p "$TMPDIR"
          pytest -q --device cpu

      - name: Report disk usage
        if: always()
        run: df -h

  test-distributed:
    name: Tests (CPU, 4 ranks)
    runs-on: ubuntu-latest
    # Distributed tests exercise the process mesh and gradient reduction, which
    # single-rank runs cannot cover. Allowed to fail until the job is validated
    # on a runner with enough disk; remove continue-on-error once it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/jigsaw/
          pip install -e ".[dev]"

      - name: Run distributed tests
        env:
          TMPDIR: ${{ github.workspace }}/.pytest-tmp
        run: |
          mkdir -p "$TMPDIR"
          mpirun -n 4 --oversubscribe --allow-run-as-root pytest -q --device cpu

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
