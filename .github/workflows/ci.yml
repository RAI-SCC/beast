name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    # Non-blocking for now: `mypy` over the whole package reports 22 pre-existing
    # errors (14 of them in beast/data/era5/dataset.py). They have stayed invisible
    # because the pre-commit hook passes filenames, so it only ever checks the
    # files in a given commit. Fix them, then drop this line -- see
    # docs/publishing-checklist.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/jigsaw/
          pip install -e ".[dev]"

      - name: mypy
        run: mypy --config-file pyproject.toml --ignore-missing-imports

  test:
    name: Tests (CPU, single rank)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/jigsaw/
          pip install -e ".[dev]"

      # The suite builds real zarr stores as fixtures, ~490 MB per single-rank
      # run. TMPDIR points at the workspace volume rather than the runner's /tmp,
      # which is the smaller of the two.
      - name: Run tests
        env:
          TMPDIR: ${{ github.workspace }}/.pytest-tmp
        run: |
          mkdir -p "$TMPDIR"
          pytest -q --device cpu

      - name: Report disk usage
        if: always()
        run: df -h

  test-distributed:
    name: Tests (CPU, 4 ranks)
    runs-on: ubuntu-latest
    # Distributed tests exercise the process mesh and gradient reduction, which
    # single-rank runs cannot cover.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/jigsaw/
          pip install -e ".[dev]"

      # --device cpu is required: the device fixture picks CUDA whenever it is
      # available and assigns rank % device_count, so without it four ranks would
      # land on one device. ~2.1 GB of scratch, since each rank gets its own dir.
      - name: Run distributed tests
        env:
          TMPDIR: ${{ github.workspace }}/.pytest-tmp
        run: |
          mkdir -p "$TMPDIR"
          mpirun -n 4 --oversubscribe --allow-run-as-root pytest -q --device cpu

      - name: Report disk usage
        if: always()
        run: df -h

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
