data:
  dt: 6
  train_data_path: /lsdf/kit/imk-tro/projects/Gruppe_Quinting/ec.era5/era5.zarr
  valid_data_path: /lsdf/kit/imk-tro/projects/Gruppe_Quinting/ec.era5/era5.zarr
  constant_masks_path: '/lsdf/kit/scc/projects/SmartWeater21/constant_masks'
  preprocessed: False
  train_subset: 1000
  valid_subset: 4
  prefetch_factor: 2
  num_workers: 16
  xlat: 720
  xlon: 1440
  lite: false
model:
  type: ViT
  hidden_dim: 1600
  transformer_dim: 1200
  heads: 6
  n_blocks: 2
  model_parallel: True
  patch_size: 120
  stride: 120
  add: False
  positional_encoding: False
  patch_embed: 1
  latent_rollout: 1
  upt: False
  concat: False
  linear_residual: True
  dropout: 0.001
training:
  lr: 0.0001
  lr_embedding: 0.00002
  lr_recovery: 0.00002
  n_samples: 3
  n_epochs: 50
  lr_min: 0.000001
  surface_weights: [6.0, 3.08, 3.08, 4.0] # MSLP, U10, V10, T2M
  pressure_weights: [3.0, 0.6, 1.5, 1.0, 1.0] # variables: Z, Q, T, U, V
  loss: 'L2'
  lr_constant: False
  train_batch: 1
  valid_batch: 1
  identity: False
  grad_clip: 1
  save_dir: .
  preload: False
  file_path: .
  load_path: .
  area_weighted: True
  print: False
  tf32: True
model_parallel:
  parallelism: 2
  type: jigsaw
