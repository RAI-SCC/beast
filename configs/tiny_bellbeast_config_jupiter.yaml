data:
    dt: 6
    train_data_path: "era5_hourly_1.5deg.zarr" # era5_hourly_1.5deg.zarr on jupiter, 1959-2022-1h-240x121_equiangular_with_poles_conservative.zarr on horeka
    valid_data_path: "era5_hourly_1.5deg.zarr" # era5_hourly_1.5deg.zarr on jupiter, 1959-2022-1h-240x121_equiangular_with_poles_conservative.zarr on horeka
    constant_masks_path: "constant_masks"
    constant_masks : ["soil_type_121_240_normalized.npy", "topography_121_240_normalized.npy", "land_sea_mask_121_240.npy"]
    preprocessed: False
    normalization_dir: "data/normalization"
    train_subset: -1
    valid_subset: -1
    train_time_range: ["1979-01-01", "2020-12-31"]
    valid_time_range: ["2021-01-01", "2022-12-31"]
    test_time_range: ["2021-01-01", "2022-12-31"]
    prefetch_factor: 2
    num_workers: 7
    xlat: 120
    xlon: 240
    n_variables: 84
    n_in_timesteps: 1 #Can be 1 or 2, other not supported atm
model:
    n_input_channels: 87 #Will be overwritten internally to fit the data set specifications
    embedding_dimension: 1024
    n_output_channels: 84
    n_attn_heads: [16,32,16]
    patch_size: 2
    noise_dim: 32
    window_size_outer: [12, 30]
    window_size_inner: [10, 20]
    n_attn_blocks: [2,3,2]
    bayesian: True
    latent_rollout: 1
training:
    tf32: True
    n_samples: 4 #This is per SP Process, so the total number of samples is n_samples * process_group("SP").size()
    n_epochs: 10
    batch_size: 1
    lr_scheduler: False
    low_lr: 0.00001
    normal_lr: 0.0001
    dtype: float32
    autocast: True
    timings: False
    checkpoint_interval: 1000
    flash_attn: True
model_parallel:
    parallelism: 1
    type: jigsaw
mesh_dims: [1,2,2,1,1] # experts, dp, up, jigsaw spatial, jigsaw channels
