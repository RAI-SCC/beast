data:
    dt: 6
    train_data_path: "era5_stackedvars_test.zarr"
    valid_data_path: "era5_stackedvars_test.zarr"
    constant_masks_path: "constant_masks"
    constant_masks : ["soil_type_normalized.npy", "topography_normalized.npy", "land_mask.npy"]
    preprocessed: False
    normalization_dir: "data/normalization"
    train_subset: -1
    valid_subset: -1
    train_time_range: ["1979-01-01", "1979-01-02"]
    valid_time_range: ["1979-01-01", "1979-01-02"]
    test_time_range: ["1979-01-01", "1979-01-02"]
    dataset_subsampling: 1
    target_subsampling: 6
    prefetch_factor: 2
    num_workers: 16
    xlat: 720
    xlon: 1440
    n_variables: 84
model:
    n_input_channels: 88
    embedding_dimension: 192
    n_output_channels: 84
    n_attn_heads: 6
    patch_size: 4
    window_size_outer: [6, 12]
    window_size_inner: [6, 6]
    n_attn_blocks: [3,2,3]
    latent_rollout: 1
training:
    tf32: True
    n_samples: 4 #This is per SP Process, so the total number of samples is n_samples * process_group("SP").size()
    n_epochs: 3
    batch_size: 1
model_parallel:
    parallelism: 4
    type: jigsaw
mesh_dims: [1,1,2,2,2]
