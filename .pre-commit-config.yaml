default_language_version:
  python: python3.12
repos:
  - repo: local
    hooks:
    - id: pytest
      name: pytest
      entry: ./.venv/bin/pytest tests
      language: system
      types: [python]
      pass_filenames: false
      always_run: true
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0 # Use the sha / tag you want to point at
    hooks:
      - id: mypy
        args: [--config-file, pyproject.toml, --ignore-missing-imports]
        additional_dependencies:
          - torch
        pass_filenames: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0
    hooks:
      # Check docstrings against numpydoc; configured in pyproject.toml.
      - id: numpydoc-validation
        files: ^beast/
  - repo: https://github.com/citation-file-format/cffconvert
    # No stable release for the pre-commit hook here, so commit pinned
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      # Validate CITATION.cff against the Citation File Format schema.
      - id: validate-cff
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
