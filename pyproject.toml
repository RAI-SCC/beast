[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beast"
version = "0.0.1"
description = "Host repository for the BEAST weather prediction model"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

requires-python = ">=3.12"

dependencies = [
    "h5py>=3.16.0",
    "torch-blue @ git+https://github.com/RAI-SCC/torch_blue@stable-beast",
    "torch>=2.11.0",
    "xarray>=2026.4.0",
]


[project.optional-dependencies]
dev = [
    # Testing
    "pytest",
    "coverage",
    "mpi4py>=4.1.1",

    # QA
    "pre-commit",
    "ruff",
    "mypy",

]

[project.urls]
Homepage = "https://github.com/RAI-SCC/Beast"
Repository = "https://github.com/RAI-SCC/Beast"
Issues = "https://github.com/RAI-SCC/Beast/issues"

# Build - Hatchling
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["beast", "libs/jigsaw"]

[tool.hatch.build.targets.sdist]
include = [
    "beast",
    "libs/jigsaw",
]

# Mypy
[tool.mypy]
python_version="3.12"
packages=["beast"]
exclude=[
    'tests/',
]

disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs=true
warn_return_any=true
show_error_codes =true
warn_unused_ignores=false
follow_imports = "normal"
follow_untyped_imports = true

# Ruff
[tool.ruff]
target-version = "py312"
exclude = ["docs", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "D417", "N"]
ignore = ["E501", "NPY201"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

# Testing
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["beast"]
command_line = "-m pytest"

[tool.coverage.report]
format = "markdown"

[tool.uv.workspace]
members = [
    "libs/jigsaw",
]
